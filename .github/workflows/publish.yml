name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never cancel a publish part way through.
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Run the full CI pipeline against the merge commit before releasing it.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the release tag
      id-token: write # to sign the npm provenance attestation
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org/

      # Every merge to main runs this workflow, but most merges do not bump the
      # version. Publishing an already published version fails, so check first
      # and no-op instead of turning main red on ordinary merges.
      - name: Check whether this version is already published
        id: check
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VERSION is already on npm - nothing to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VERSION is not on npm yet - publishing."
          fi

      - if: steps.check.outputs.publish == 'true'
        run: npm ci

      # prepublishOnly runs the build, which is also where publint and
      # are-the-types-wrong run, so a bad package cannot be published.
      #
      # Authentication should be trusted publishing (OIDC), not a token.
      # Register this repository and this workflow filename as a trusted
      # publisher for the package on npmjs.com; npm then exchanges the Actions
      # OIDC token for a short lived credential by itself, using the
      # id-token: write permission already granted above for provenance. There
      # is nothing to add here — npm attempts OIDC automatically on GitHub
      # Actions and falls back silently when the registry has no trusted
      # publisher configured, so it is safe to leave the token in place until
      # OIDC is confirmed working, then delete the secret and the env below.
      #
      # NPM_TOKEN is the fallback and is on the way out. npm is removing direct
      # publishing from 2FA-bypass tokens around January 2027, after which they
      # can only stage a publish for a human to approve.
      #
      # For as long as it is used it has to be a granular access token — legacy
      # tokens were removed in November 2025 — with read/write on this package
      # and "Bypass 2FA" turned on. That setting defaults to off when a token is
      # created, and off is what produces EOTP: the token authenticates, the
      # registry asks for a one-time password anyway, and a runner has no TTY to
      # answer with.
      - if: steps.check.outputs.publish == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag the release
        if: steps.check.outputs.publish == 'true'
        env:
          TAG: v${{ steps.check.outputs.version }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
